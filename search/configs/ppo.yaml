label: ppo
algorithm: ppo
# PPO is on-policy and benefits from massively parallel envs — mirrors
# train.py's _default_num_envs_classic.
num_envs: 1024

# Decrement Euclidean reward (‖e_prev‖²-‖e_next‖², M = I) rather than the
# default per-step -‖e‖² level cost — see env_base.get_rewards' reward_euclidean
# branch. Static flag, not a swept parameter (see build_sweep.py's extra_flags
# comment for why a store_true flag can't go in `parameters:`).
extra_flags: ["--reward_euclidean"]

metric:
  name: "Reward / Total reward (mean)"
  goal: maximize

parameters:
  agent.discount_factor:
    values: [0.1, 0.3, 0.5, 0.7, 0.9, 0.99, 0.999]
  agent.gae_lambda:
    values: [0.9, 0.95, 0.975, 1.0]
  agent.ratio_clip:
    values: [0.1, 0.2, 0.3]
  agent.entropy_loss_scale:
    values: [0.0, 0.001, 0.01]
  models.policy.backbone:
    # mlp (plain MLP, u = MLP(obs)) | control (CLActor, u = uref + feedback(x-xref))
    values: [mlp, control]
  # Same ladder as c3m.yaml's agent.actor_architecture, but applied to both the
  # actor and critic nets (train.py's network_architecture handling) — c3m has
  # no critic, so this keeps the two searches on comparable network capacity.
  network_architecture:
    values:
      - [64, 64]
      - [128, 128]
      - [512, 512]
      - [128, 128, 128, 128]
