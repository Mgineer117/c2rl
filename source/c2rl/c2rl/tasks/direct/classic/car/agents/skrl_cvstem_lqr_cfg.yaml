seed: 42  # Random seed for reproducibility

# CV-STEM-LQR: Tsukamoto's CV-STEM contraction controller — analytical (no RL),
# u = uref - K(x)(x-xref) with K(x) = R⁻¹B(x)ᵀM(x), M(x)=W(x)⁻¹ from the CV-STEM
# metric SDP (one joint program over uniform state-box samples, ν/χ shared
# — Tsukamoto's classncm.cvstem0). See agents/skrl/cvstem_lqr.py.

agent:
  # lbd/r_scaler/w_lb/w_ub come from scripts/find_uniform_lambda.py run at
  # N=100 with --cm-eps 0.1 --cm-dt 1.0 --w-lb 0.001 --w-ub 1000, and are then
  # Certified by the N=10000 synthesis below at cm_eps 0.01. The two eps values
  # are deliberate, not a mismatch: eps buys a covering radius eps/L around each
  # sample, so a 100-sample search needs the larger margin and a 10000-sample
  # solve does not. See docs/subset_lambda_procedure.md sections 7 and 8d.
  class: CVSTEM-LQR
  # R = r_scaler·I, used in both the metric SDP's Riccati term and the deployed
  # gain K = R⁻¹BᵀM — a single knob so K stays the certified CV-STEM gain.
  # Measured jointly with cm.lbd / cm.cm_w_lb / cm.cm_w_ub below; the four are
  # one solution of one program, not four independent knobs. The old 0.01 gave
  # ‖K‖ ≈ 53 and drove 98% of controls outside the actuator box.
  r_scaler: 1.6
  experiment:
    directory: "car_cvstem_lqr"
    experiment_name: ""
    write_interval: "auto"
    checkpoint_interval: "auto"
    wandb: true
    wandb_kwargs:
      project: c2rl
      name:

# ── The joint CV-STEM SDP (Tsukamoto's classncm.cvstem0) ───────────────────── #
cm:
  # λ — the certified contraction rate. Comes from scripts/find_uniform_lambda.py
  # (the λ-selection step; the reference's own linesearch is not run here), which
  # solves this program: λ down by 1.5 on LMI infeasibility, agent.r_scaler up by
  # 2 whenever >5% of the generated u = uref - (1/r)BᵀM·e leave the 2x-expanded
  # uref box. At λ=0.3902 / r=1.6 / w=[0.01,100]: 3.73% outside, ν=4.233,
  # χ=3.853, J=14.11, |u|max=2.645, AUC 2.034.
  # Matches cm.lbd / cvstem_r_scaler / w_lb / w_ub / cm_eps in
  # skrl_c2rl_ppo_cfg.yaml, so both algorithms certify the same rate under the
  # same envelope. They still solve different programs — joint-with-Ẇ here,
  # pointwise-without there — so equal settings do not mean equal metrics.
  # See ncm_synthesis.py.
  lbd: 0.3902
  # ε, strict-definiteness margin on the LMI (his epsilon). NOTE λ above was
  # searched at find_uniform_lambda's --cm-eps default of 0.01; 0.1 is the
  # stricter margin, aligned with the c2rl configs so the two share one setting.
  # Re-check feasibility here if λ or the envelope moves.
  cm_eps: 0.01
  # Tsukamoto's CV-STEM sampling period, which is a synthesis hyperparameter and
  # Not the integrator step: his cart-pole notebook uses dt=1 while the sim runs
  # at 0.1 and RK4-substeps at 0.01. Unset, this falls back to the env integrator
  # step, a much harsher (W-I)/dt bound that inflates nu by the same factor.
  cm_dt: 1.0
  # Deployment envelope w_lb·I ⪯ W ⪯ w_ub·I, as the two scalar caps ν ≤ 1/w_lb
  # and χ ≤ ν·w_ub on the joint program's shared ν/χ. Absent, this is the
  # reference program (no envelope at all) — but then nothing bounds the gain
  # ‖K‖ ≤ ‖B‖/(r·w_lb), and λ above was certified with these caps in place.
  cm_w_lb: 0.001
  cm_w_ub: 1000.0
  cm_solver: MOSEK  # SCS (no license) | CLARABEL | MOSEK (tightest/fastest; see README)
  # Uniform state-box samples in the one joint SDP (his Nx=1000). A solver-Size
  # knob: each sample adds an x_dim² PSD block plus two LMIs to a single problem.
  cm_samples: 10000
  cm_seed: 0
  # Cache the joint solve (see CVSTEMLQRCfg.cm_data_path). Keyed on every
  # knob that enters the program, so a config change re-solves rather than
  # loading a metric certifying a different rate.
  cm_data_path: "data/classic/car/cvstem.npz"
  # Uncomment for his lambda selection instead (linesearch: walk lambda up from
  # lo to hi in steps of da, take argmin J = chi/lambda + nu). It ignores `lbd`
  # above and does not look at the actuator box.
  # lbd_linesearch: [0.1, 3.0, 0.1]

# ── The metric network: x -> chol(M) (nn_modules.CholMetric) ──────────────── #
cmg:
  # The reference's own architecture: a 3x100 ReLU MLP on the raw state.
  cmg_hidden_dims: [100, 100, 100]
  # ~84k gradient steps (cm_samples=10000 x 0.9 train // 320 per batch = 28
  # batches per epoch, x 3000 epochs). That count, not the sample count, is what
  # the fit is starved of: measured relative error on M is 0.55 / 0.23 / 0.06 /
  # 0.03 at 0.5k / 5k / 25k / 100k steps.
  cmg_regress_epochs: 3000
  cmg_regress_lr: 1.0e-3
  # regress_cholm does `iters = n_train // batch_size`, so the batch must scale
  # With cm_samples or the step budget silently moves: at N=1000 the right value
  # was 32 (measured at N=400: 16.8% median relative error on M at batch 256 vs
  # 3.0% at 32, same epoch count), and 320 is that same 28-batches-per-epoch
  # ratio at N=10000. Scaling the batch rather than the epochs keeps
  # cmg_early_stop_patience meaning the same thing.
  cmg_regress_batch_size: 320
  # gamma per epoch, so it must be sized to the epoch count: 0.99^3000 would
  # annihilate the lr by epoch ~500. 0.999^3000 lands at 5e-5.
  cmg_regress_lr_scheduler: "StepLR"
  cmg_regress_lr_scheduler_kwargs:
    step_size: 1
    gamma: 0.999
  # Also in epochs. At 30 (the dataclass default) this would stop after ~1k
  # steps, i.e. before the fit has started.
  cmg_early_stop_patience: 300
trainer:
  class: SequentialTrainer
  timesteps: 10000  # Total number of environment steps to evaluate for
  environment_info: log  # Enable logging of stability metrics from info["log"]
