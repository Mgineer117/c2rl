name: CI

# The whole suite runs without Isaac Sim: the classic analytical environments are
# pure NumPy/torch, and the Isaac-side contracts are checked statically (AST +
# config files) rather than by launching a simulator. See tests/test_isaac_parity.py.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # Bug classes only (dead code, undefined names, bare except), not style.
      # A repo-wide style pass would mean reordering imports, and this project has
      # load-bearing import order — scripts/skrl/train.py must import AppLauncher
      # before anything else on the Isaac route. Style is handled by pre-commit.
      - run: ruff check source scripts --select F401,F811,F821,F841,E711,E712,E714,E722

  smoke:
    # One short end-to-end run per algorithm. Catches breakage that unit tests
    # cannot: a config key that silently stops being applied still imports fine.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        algorithm: [ppo, sac, lqr, sdlqr, cvstem-lqr, c2rl-ppo, c2rl-sac]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "skrl>=2.0.0" "gymnasium>=0.29" pyyaml scipy "cvxpy<1.7" tqdm
          # The package itself — without this every algorithm dies at `import c2rl`.
          pip install -e source/c2rl --no-deps
      # --memory_size 1000: the reference window stays at its real full-episode
      # size (obs_dim 3004), because exercising the shipped observation layout is
      # the entire point of this job -- a shape bug that only appears at the full
      # window has to fail here. What gets shrunk instead is the replay buffer,
      # which skrl allocates as (memory_size, num_envs, obs_dim) PER ENVIRONMENT:
      # at the yaml's 100000 that is 9.6 GB for `states` alone and ~19.6 GB peak,
      # against a runner's 7 GB, so sac and c2rl-sac were OOM-killed (SIGTERM,
      # exit 143, reported as "the runner has received a shutdown signal"). A
      # 200-step run fills 200 slots, so 100000 of them were never anything but
      # waste. Measured: 19.6 GB -> 0.99 GB, full window intact.
      - name: Train ${{ matrix.algorithm }} on classic-car-v0
        run: |
          python scripts/skrl/train.py --classic --task classic-car-v0 \
            --algorithm ${{ matrix.algorithm }} --num_timesteps 200 \
            --memory_size 1000 --num_envs 8 --device cpu --no_wandb --skip_final_eval
